[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaqubit-decoder"
version = "0.1.0"
description = "Open reference implementation of a recurrent-transformer neural decoder for surface codes (AlphaQubit-style)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.2",
    "stim>=1.13",
    "pymatching>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
alphaqubit-train = "alphaqubit.train:main"
alphaqubit-eval = "alphaqubit.evaluate:main"

[tool.setuptools]
packages = ["alphaqubit"]
